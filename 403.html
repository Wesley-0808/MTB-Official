      const hostname = location.hostname;
      let isInternal = false;
      const timestamp = new Date().getTime();
      const key = `SDZZ-MtB-POWER-BY-WESLEY${timestamp}`;
      const publicKey = `-----BEGIN PUBLIC KEY-----MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvpVwZjHFkNbMN6fCiLoerBRySetkXVHRSO3dvWnNF8Va3ZBqCpVzoJP12NLNGcXB769p/BHeL+0Yzkc6ZipJCCrENOPGFtgK4QpGyig/WhBuksZ0vCCIWWE/SlIC1Y2S8AF0Wx3o8YOZ3hiWfvS4jreMC/7dwV+3klio1sIVGGGzz+UPZh70QR6l9Gtv+bebVeYrddvNUUlB+TPJdrwyDi1aotHg9IA4/DUMTlQDqsrN0TdCSlK3oby+jjpAAPZzAXifZM5GOQ6ydnMH5KjcmsUsBjZ4D7l1WlIWsReMeQPO/d8WXDerrzkmQj49TlDq2kA4WZ9VO++pCAzehPUi0wIDAQAB-----END PUBLIC KEY-----`;
      async function fetchWithTimeout(resource, options = {}) {
        const { timeout = 1000 } = options;

        const controller = new AbortController();
        const id = setTimeout(() => controller.abort('timeout'), timeout);
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal,
        });
        clearTimeout(id);
        return response;
      }

      fetchWithTimeout(
        `https://local.sdzzmtb.cn/?timestamp=${timestamp}`,
        { timeout: 1500 }
      )
        .then((response) => response.json())
        .then(async (data) => {
          const signature = data.signature;
          const verified = await RSAVerify.verifySignature(key, signature, publicKey);
          console.log('Verification result:', verified);
          if (verified) {
            isInternal = true;
            // Redirect to the original page or perform desired action
            let prefix = "";
            if (hostname === "www.sdzzmtb.cn") {
                prefix = "www.";
            }
            location.href = `https://${prefix}i.sdzzmtb.cn`;
          }
        })
        .catch((error) => {
          console.error("Error fetching internal", error);
        });

      if (hostname.endsWith("sdzzmtb.cn")) {
        function jupmWxwork() {

        document.getElementById("domainName").innerHTML = location.host;

        function checkUA() {
          let userAgent = navigator.userAgent;
          let Agents = [
            "Android",
            "iPhone",
            "iPad",
            "iPod",
            "Phone; OpenHarmony",
          ];
          let flag = false;
          for (let i in Agents) {
            if (userAgent.indexOf(Agents[i]) > -1) {
              flag = true;
              break;
            }
          }
          return flag;
        }

        window.onload = function () {
          if (checkUA() === true) {
